<!doctype html>
<html>
	<head lang="en">
		<title>Coordinates</title>
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="On press">
			<sdpi-checkbox setting="shareOnPress" label="Send my position to chat"></sdpi-checkbox>
		</sdpi-item>
		<sdpi-item label="Chat text">
			<sdpi-textfield setting="template" placeholder="I'm at X {x} Y {y} Z {z} ({dimension})"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item>
			<div style="opacity: 0.7; line-height: 1.4;">Placeholders: <code>{x}</code> <code>{y}</code> <code>{z}</code> <code>{dimension}</code> <code>{biome}</code></div>
		</sdpi-item>
		<script src="connection.js"></script>
	</body>
</html>
