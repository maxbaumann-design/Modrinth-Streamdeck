name: Release

# Push a tag such as v1.0.0 to build both parts and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: streamdeck-plugin/package-lock.json

      - name: Build mod
        working-directory: fabric-mod
        run: ./gradlew build --no-daemon

      - name: Build plugin
        working-directory: streamdeck-plugin
        run: |
          npm ci
          npm run build
          npm run validate
          npm run pack

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            fabric-mod/build/libs/streamdeck-bridge-*.jar
            !fabric-mod/build/libs/*-sources.jar
            streamdeck-plugin/dist/*.streamDeckPlugin

      # Optional: publish the mod to Modrinth automatically.
      # 1. Create the project on https://modrinth.com and copy its project ID.
      # 2. Create a personal access token (Settings → PATs) with "Create versions" permission
      #    and store it as the repository secret MODRINTH_TOKEN.
      # 3. Replace REPLACE_WITH_PROJECT_ID below and remove the `if: false`.
      - name: Publish to Modrinth
        if: false
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: REPLACE_WITH_PROJECT_ID
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            fabric-mod/build/libs/!(*-sources).jar
          loaders: fabric
          game-versions: "26.3"
          dependencies: |
            fabric-api(required)
          version-type: release
          changelog: |
            See the GitHub release for details and the matching Stream Deck plugin download.
